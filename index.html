<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级座位系统</title>
    <style>
        :root {
            --seat-size: 60px;
            --unified-gap: 12px;
            --block-margin: 50px;
        }

        * { box-sizing: border-box; }

        html, body { 
            overflow: hidden; 
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0f0f1a;
            color: white;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        #particle-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }

        .top-space { height: 40px; }

        .classroom {
            display: flex; flex-direction: row; 
            gap: var(--block-margin); padding: 30px;
            padding-bottom: 120px; 
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px; position: relative;
        }

        /* 教学设施重分布 */
        .teacher-desk {
            position: absolute; bottom: 20px; left: 30px; /* 左下角 */
            width: 120px; height: 50px;
            background: #5d4037; border: 2px solid #3e2723;
            border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: #d7ccc8;
        }
        .whiteboard {
            position: absolute; bottom: 20px; left: 50%; /* 正下方 */
            transform: translateX(-50%);
            width: 450px; height: 12px;
            background: #fdfdfd; border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .area { display: grid; gap: var(--unified-gap); }
        .grid-2x6 { grid-template-columns: repeat(2, var(--seat-size)); }
        .grid-3x5 { 
            grid-template-columns: repeat(3, var(--seat-size)); 
            margin-top: calc(var(--seat-size) + var(--unified-gap)); 
        }

        .seat {
            width: var(--seat-size); height: var(--seat-size);
            border: 2px solid rgba(190, 224, 247, 0.2);
            border-radius: 8px; background: rgba(0, 0, 0, 0.2);
        }

        .fixed-target { border: 2px solid #ffd700 !important; }

        button {
            margin: 20px 0; padding: 12px 40px; font-size: 18px;
            background: linear-gradient(to right, #2ecc71, #27ae60); 
            color: white; border: none; border-radius: 50px; cursor: pointer;
            position: relative; z-index: 2000; transition: all 0.3s ease;
        }
        button:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        .particle {
            position: absolute; left: 0; top: 0;
            width: var(--seat-size); height: var(--seat-size);
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="top-space"></div>
    <button id="btn" onclick="startShuffle()">开始排座</button>

    <div class="classroom" id="classroom">
        <div class="area grid-2x6" id="area1"></div>
        <div class="area grid-3x5" id="area2"></div>
        <div class="area grid-2x6" id="area3"></div>
        <div class="area grid-2x6" id="area4"></div>
        
        <div class="teacher-desk">老师座位</div>
        <div class="whiteboard"></div>
    </div>

    <div id="particle-container"></div>

    <script>
        // --- 参数调整区 ---
        const PARAMS = {
            planetDuration: 2800,      // 普通行星飞行时间
            galaxyDuration: 5000,      // 银河团飞行时间 (更慢)
            orbitRadius: 110,          // 普通组绕转半径
            innerRadius: 90,           // 银河内层半径
            outerRadius: 170,          // 银河外层半径
            orbitSpeed: 0.003,         // 旋转速度系数
            stagger: 50               // 组入场延迟
        };

        const fixedAssignments = {1: { r: 6, c: 2}, 17: { r: 6, c: 1 }, 13: { r: 6, c: 5 }};
        const avoidRestrictions = {15: { avoidR: [1,2,3], avoidC: [] }};
        const socialConstraints = [{ ids: [14, 45], minDist: 2 }];

        const config = [
            { id: 'area1', c: 2, r: 6, startCol: 1 } , 
            { id: 'area2', c: 3, r: 5, startCol: 3 },
            { id: 'area3', c: 2, r: 6, startCol: 6 }, 
            { id: 'area4', c: 2, r: 6, startCol: 8 }
        ];

        let seatInfo = [], particles = [], isAnimating = false;

        function getPos(idx) {
            const rect = seatInfo[idx].el.getBoundingClientRect();
            return { x: rect.left, y: rect.top };
        }

        function findSeatIdx(r, c) { return seatInfo.findIndex(s => s.r === r && s.c === c); }

        function init() {
            const container = document.getElementById('particle-container');
            config.forEach(block => {
                const el = document.getElementById(block.id);
                for (let r = 0; r < block.r; r++) {
                    for (let c = 0; c < block.c; c++) {
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        const realR = (block.id === 'area2') ? r + 2 : r + 1;
                        const realC = block.startCol + c;
                        for (let id in fixedAssignments) {
                            if (fixedAssignments[id].r === realR && fixedAssignments[id].c === realC) seat.classList.add('fixed-target');
                        }
                        el.appendChild(seat);
                        seatInfo.push({ el: seat, r: realR, c: realC });
                    }
                }
            });

            for (let i = 1; i <= 51; i++) {
                const p = document.createElement('div');
                p.className = 'particle'; p.innerText = i;
                container.appendChild(p);
                particles.push(p);
                const startX = (window.innerWidth / 51) * (i - 1);
                p.style.transform = `translate(${startX}px, ${window.innerHeight + 100}px)`;
                if(fixedAssignments[i]) {
                    const idx = findSeatIdx(fixedAssignments[i].r, fixedAssignments[i].c);
                    const pos = getPos(idx);
                    p.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                    p.style.borderRadius = '8px'; p.style.background = '#fff'; p.style.color = '#1a1a2e';
                }
            }
        }

                function getValidShuffle() {
            let nums = new Array(seatInfo.length).fill(0);
            let used = new Set();

            // 1. 安置固定座位
            for (let id in fixedAssignments) {
                const s = fixedAssignments[id], idx = findSeatIdx(s.r, s.c);
                if (idx !== -1) { nums[idx] = parseInt(id); used.add(parseInt(id)); }
            }

            // 2. 准备学生列表
            let others = [];
            for (let i = 1; i <= 51; i++) if (!used.has(i)) others.push(i);
            others.sort(() => Math.random() - 0.5);

            // 3. 分配座位并检查所有约束
            for (let id of others) {
                let possibleIndices = [];
                for (let i = 0; i < seatInfo.length; i++) {
                    if (nums[i] !== 0) continue; 

                    // --- 检查 A: 避让限制 (avoidRestrictions) ---
                    if (avoidRestrictions[id]) {
                        const res = avoidRestrictions[id];
                        if (res.avoidR.includes(seatInfo[i].r) || res.avoidC.includes(seatInfo[i].c)) continue;
                    }

                    // --- 检查 B: 社交约束 (socialConstraints) ---
                    let isSocialConflict = false;
                    for (let con of socialConstraints) {
                        if (con.ids.includes(id)) {
                            const partnerId = con.ids.find(x => x !== id);
                            const partnerIdx = nums.indexOf(partnerId);
                            if (partnerIdx !== -1) {
                                // 计算行列距离：如果距离 <= minDist，则冲突
                                const rDist = Math.abs(seatInfo[i].r - seatInfo[partnerIdx].r);
                                const cDist = Math.abs(seatInfo[i].c - seatInfo[partnerIdx].c);
                                if (rDist === 0 && cDist <= con.minDist) isSocialConflict = true;
                            }
                        }
                    }
                    if (isSocialConflict) continue;

                    possibleIndices.push(i);
                }

                if (possibleIndices.length > 0) {
                    const randomIdx = possibleIndices[Math.floor(Math.random() * possibleIndices.length)];
                    nums[randomIdx] = id;
                } else {
                    // 如果被限制卡死，强制寻找第一个空位
                    let fallback = nums.findIndex(n => n === 0);
                    nums[fallback] = id;
                }
            }
            return nums;
        }



        // --- 普通星系动画 ---
        async function runPlanetaryAnimation(batch, finalLayout) {
            const leaderId = batch[0], satellites = batch.slice(1);
            const leaderP = particles[leaderId - 1];
            const leaderDest = getPos(finalLayout.indexOf(leaderId));
            const satelliteDests = satellites.map(id => getPos(finalLayout.indexOf(id)));
            
            // 随机脱离时间点
            const detachThresholds = satellites.map(() => 0.25 + Math.random() * 0.6);

            const startX = window.innerWidth / 2;
            const startY = window.innerHeight + 150;
            const startTime = performance.now();

            return new Promise(resolve => {
                function frame(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / PARAMS.planetDuration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    const curX = startX + (leaderDest.x - startX) * ease;
                    const curY = startY + (leaderDest.y - startY) * ease;
                    leaderP.style.transform = `translate(${curX}px, ${curY}px)`;

                    satellites.forEach((id, i) => {
                        const p = particles[id - 1];
                        const dest = satelliteDests[i];
                        const orbitAngle = (now * PARAMS.orbitSpeed) + (i * (Math.PI * 2 / satellites.length));
                        
                        if (progress < detachThresholds[i]) {
                            // 绕转阶段
                            const sx = curX + Math.cos(orbitAngle) * PARAMS.orbitRadius;
                            const sy = curY + Math.sin(orbitAngle) * PARAMS.orbitRadius;
                            p.style.transform = `translate(${sx}px, ${sy}px)`;
                        } else {
                            // 收缩入座阶段 (按用户要求的逻辑)
                            const innerProgress = (progress - detachThresholds[i]) / (1 - detachThresholds[i]);
                            const collapseX = curX + Math.cos(orbitAngle) * PARAMS.orbitRadius * (1 - innerProgress);
                            const collapseY = curY + Math.sin(orbitAngle) * PARAMS.orbitRadius * (1 - innerProgress);
                            
                            const fx = collapseX + (dest.x - collapseX) * innerProgress;
                            const fy = collapseY + (dest.y - collapseY) * innerProgress;
                            
                            p.style.transform = `translate(${fx}px, ${fy}px)`;
                            if (innerProgress > 0.9) {
                                p.style.borderRadius = '8px'; p.style.background = '#fff'; p.style.color = '#1a1a2e';
                            }
                        }
                    });

                    if (progress < 1) requestAnimationFrame(frame);
                    else {
                        leaderP.style.borderRadius = '8px'; leaderP.style.background = '#fff'; leaderP.style.color = '#1a1a2e';
                        resolve();
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        // --- 单核双层大型银河动画 ---
        async function runGalaxyAnimation(remainingIds, finalLayout) {
            const leaderId = remainingIds.shift(); // 唯一行星
            const satellites = remainingIds;
            const leaderP = particles[leaderId - 1];
            const leaderDest = getPos(finalLayout.indexOf(leaderId));
            
            const detachThresholds = satellites.map(() => 0.4 + Math.random() * 0.45);

            const startX = window.innerWidth / 2;
            const startY = window.innerHeight + 200;
            const startTime = performance.now();

            return new Promise(resolve => {
                function frame(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / PARAMS.galaxyDuration, 1);
                    const ease = progress; // 匀速更平稳

                    const curX = startX + (leaderDest.x - startX) * ease;
                    const curY = startY + (leaderDest.y - startY) * ease;
                    leaderP.style.transform = `translate(${curX}px, ${curY}px)`;

                    satellites.forEach((id, index) => {
                        const p = particles[id - 1];
                        const dest = getPos(finalLayout.indexOf(id));
                        
                        // 分层逻辑
                        const isInner = index < satellites.length / 2;
                        const radius = isInner ? PARAMS.innerRadius : PARAMS.outerRadius;
                        const speed = isInner ? PARAMS.orbitSpeed : -PARAMS.orbitSpeed * 0.7;
                        const orbitAngle = (now * speed) + (index * 1.2);

                        if (progress < detachThresholds[index]) {
                            const sx = curX + Math.cos(orbitAngle) * radius;
                            const sy = curY + Math.sin(orbitAngle) * radius;
                            p.style.transform = `translate(${sx}px, ${sy}px)`;
                        } else {
                            // 收缩入座阶段
                            const innerProgress = (progress - detachThresholds[index]) / (1 - detachThresholds[index]);
                            const collapseX = curX + Math.cos(orbitAngle) * radius * (1 - innerProgress);
                            const collapseY = curY + Math.sin(orbitAngle) * radius * (1 - innerProgress);
                            
                            const fx = collapseX + (dest.x - collapseX) * innerProgress;
                            const fy = collapseY + (dest.y - collapseY) * innerProgress;
                            
                            p.style.transform = `translate(${fx}px, ${fy}px)`;
                            if (innerProgress > 0.9) {
                                p.style.borderRadius = '8px'; p.style.background = '#fff'; p.style.color = '#1a1a2e';
                            }
                        }
                    });

                    if (progress < 1) requestAnimationFrame(frame);
                    else {
                        leaderP.style.borderRadius = '8px'; leaderP.style.background = '#fff'; leaderP.style.color = '#1a1a2e';
                        resolve();
                    }
                }
                requestAnimationFrame(frame);
            });
        }

        async function startShuffle() {
            if (isAnimating) return;
            isAnimating = true;
            document.getElementById('btn').disabled = true;

            const finalLayout = getValidShuffle();
            const fixedIds = Object.keys(fixedAssignments).map(Number);
            let pool = Array.from({length: 51}, (_, i) => i + 1).filter(id => !fixedIds.includes(id)).sort(() => Math.random() - 0.5);

            // 分批入场：每批5人
            while(pool.length > 15) {
                const batch = pool.splice(0, 3 + Math.random() * 5); 
                runPlanetaryAnimation(batch, finalLayout);
                await new Promise(r => setTimeout(r, 1300));
            }

            // 最后一波大集合
            if(pool.length > 0) {
                await runGalaxyAnimation(pool, finalLayout);
            }

            setTimeout(() => {
                isAnimating = false;
                document.getElementById('btn').disabled = false;
            }, 500);
        }

        init();
    </script>
</body>
</html>
