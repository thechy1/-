<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级座位系统-机械直角版</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a2e'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='STKaiti, KaiTi, serif' font-size='80' fill='%23ffd700'>仁</text></svg>">
    <style>
        :root {
            --seat-size: 60px;
            --unified-gap: 12px;
            --block-margin: 60px;
        }

        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background-color: #0f0f1a;
            color: white;
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; min-height: 100vh; overflow: hidden; 
        }

        .top-space { height: 40px; }

        .classroom {
            display: flex;
            flex-direction: row-reverse; 
            gap: var(--block-margin);
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            align-items: flex-start;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .area { display: grid; gap: var(--unified-gap); }
        .grid-2x6 { grid-template-columns: repeat(2, var(--seat-size)); }
        .grid-3x5 { 
            grid-template-columns: repeat(3, var(--seat-size)); 
            margin-top: calc(var(--seat-size) + var(--unified-gap)); 
        }

        .seat {
            width: var(--seat-size); height: var(--seat-size);
            border: 2px solid rgba(190, 224, 247, 0.719);
            border-radius: 8px; background: rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .special-seat {
            position: relative;
            border: 3px solid #ffd700 !important;
            box-shadow: 0 0 15px #ffd700, 0 0 30px rgba(255, 204, 0, 0.4);
            animation: sunGlow 2s infinite alternate ease-in-out;
        }

        @keyframes sunGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .particle {
            position: absolute;
            left: 0; top: 0;
            width: var(--seat-size); height: var(--seat-size);
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.3rem; z-index: 1000;
            opacity: 0; 
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.6);
            will-change: transform;
            pointer-events: none;
            /* 这里的 transition 只负责透明度和颜色的渐变，位移由 JS 手动控制以实现直角 */
            transition: opacity 0.3s, background 0.3s, border-radius 0.3s, color 0.3s;
        }

        .teaching-zone {
            width: 100%; max-width: 1000px; margin-top: 40px;
            display: grid; grid-template-columns: 180px 1fr 180px; align-items: center;
        }
        .teacher-desk { height: 70px; background: #d35400; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 4px 0 #a04000; }
        .whiteboard { height: 8px; background: #bdc3c7; margin: 0 60px; border-radius: 4px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        button {
            margin: 20px 0; padding: 15px 50px; font-size: 20px; letter-spacing: 2px;
            background: linear-gradient(to right, #2ecc71, #27ae60); 
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.1s;
            z-index: 2000;
        }
        button:active { transform: scale(0.95); }
        button:disabled { filter: grayscale(1); cursor: default; }
    </style>
</head>
<body>

    <div class="top-space"></div>
    <button id="btn" onclick="startShuffle()">座位安排</button>

    <div class="classroom" id="classroom">
        <div class="area grid-2x6" id="area1"></div>
        <div class="area grid-2x6" id="area2"></div>
        <div class="area grid-3x5" id="area3"></div>
        <div class="area grid-2x6" id="area4"></div>
    </div>

    <div class="teaching-zone">
        <div class="teacher-desk">老师座位</div>
        <div class="whiteboard"></div>
    </div>

    <script>
        const config = [
            { id: 'area1', c: 2, r: 6, startCol: 8 }, 
            { id: 'area2', c: 2, r: 6, startCol: 6 },
            { id: 'area3', c: 3, r: 5, startCol: 3 }, 
            { id: 'area4', c: 2, r: 6, startCol: 1 }
        ];

        let seatInfo = [];
        let particles = [];
        let goldenSeatIndex = -1; 
        
        // 记录已落座的座位索引，避免假动作去撞已坐下的人
        let occupiedIndices = new Set();

        function init() {
            seatInfo = [];
            config.forEach(block => {
                const el = document.getElementById(block.id);
                for (let r = 0; r < block.r; r++) {
                    for (let c = 0; c < block.c; c++) {
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        const logicalRow = block.r - r; 
                        const logicalCol = block.startCol + (block.c - 1 - c);
                        
                        if (logicalRow === 1 && logicalCol === 3) {
                            seat.classList.add('special-seat');
                            goldenSeatIndex = seatInfo.length; 
                        }
                        el.appendChild(seat);
                        seatInfo.push({ el: seat, row: logicalRow, col: logicalCol, index: seatInfo.length });
                    }
                }
            });

            setTimeout(() => {
                const rect = seatInfo[goldenSeatIndex].el.getBoundingClientRect();
                const gx = rect.left + window.scrollX;
                const gy = rect.top + window.scrollY;

                for (let i = 1; i <= 51; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.innerText = i;
                    document.body.appendChild(p);
                    particles.push(p);

                    if (i === 17) {
                        p.style.transform = `translate(${gx}px, ${gy}px)`;
                        p.style.opacity = '1';
                        p.style.background = '#fff';
                        p.style.color = '#1a1a2e';
                        p.style.borderRadius = '8px';
                        occupiedIndices.add(goldenSeatIndex); // 17号初始即占用
                    } else {
                        // 初始在屏幕中心
                        p.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight + 100}px)`;
                    }
                }
            }, 100);
        }

        // --- 规则查杀逻辑 ---
        function checkNoAdjacent(nums, a, b) {
            const idxA = nums.indexOf(a);
            const idxB = nums.indexOf(b);
            const s1 = seatInfo[idxA];
            const s2 = seatInfo[idxB];
            const dist = Math.abs(s1.row - s2.row) + Math.abs(s1.col - s2.col);
            return dist > 1; 
        }

        function getValidShuffle() {
            let nums = new Array(51).fill(0);
            let attempts = 0;
            const allIndices = Array.from({length: 51}, (_, i) => i);

            while (attempts < 20000) {
                attempts++;
                nums.fill(0);
                nums[goldenSeatIndex] = 17;

                const candidate21 = allIndices.filter(i => i !== goldenSeatIndex && seatInfo[i].row !== 1);
                const pos21 = candidate21[Math.floor(Math.random() * candidate21.length)];
                nums[pos21] = 21;

                const candidate32 = allIndices.filter(i => 
                    nums[i] === 0 && [3,4,5,6,7].includes(seatInfo[i].col)
                );
                if (candidate32.length === 0) continue;
                const pos32 = candidate32[Math.floor(Math.random() * candidate32.length)];
                nums[pos32] = 32;

                let constants = [17, 21, 32];
                let others = Array.from({length: 51}, (_, i) => i + 1)
                                  .filter(n => !constants.includes(n))
                                  .sort(() => Math.random() - 0.5);
                
                let oIdx = 0;
                for (let i = 0; i < 51; i++) {
                    if (nums[i] === 0) nums[i] = others[oIdx++];
                }

                if (checkNoAdjacent(nums, 14, 45)) return nums;
            }
            return nums;
        }

        // --- 异步动画工具函数 ---

        // 延迟工具
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // 获取坐标工具
        function getPos(idx) {
            const rect = seatInfo[idx].el.getBoundingClientRect();
            return {
                x: rect.left + window.scrollX,
                y: rect.top + window.scrollY
            };
        }

        // 直角移动核心函数：从当前位置 (currX, currY) 移动到 (destX, destY)
        // mode: 0=随机先后, 1=先X, 2=先Y
        async function moveOrthogonal(el, destX, destY, speed = 300) {
            // 获取当前实际 transform 值来作为起点（由于我们手动控制，需要读取计算后的样式）
            // 简单起见，我们在外部维护 currentPos，这里直接应用过渡
            
            // 为了实现直角，我们将 transition 设为 单轴时间
            const currentTransform = getComputedStyle(el).transform;
            let startX = 0, startY = 0;
            // 解析矩阵获取当前XY (简化处理，假设之前是用 translate 设置的)
            // 这里为了精准衔接，我们最好把当前的坐标传进来，或者直接应用两段式
            // 更好的方案：我们知道元素当前在哪里，因为是我们控制的。
            // 在 animateSequence 里维护 currentX/Y
        }

        // --- 动画主控 ---
        let isAnimating = false;

        async function startShuffle() {
            if (isAnimating) return;
            isAnimating = true;
            document.getElementById('btn').disabled = true;

            // 重置占用状态 (只保留17)
            occupiedIndices.clear();
            occupiedIndices.add(goldenSeatIndex);

            const finalNums = getValidShuffle();
            
            // 准备名单
            let students = [];
            for(let i=1; i<=51; i++) {
                if(i !== 17) students.push(i);
            }
            // 随机顺序入场
            students.sort(() => Math.random() - 0.5);

            // 批量处理
            let index = 0;
            while(index < students.length) {
                const batchSize = 2 + Math.floor(Math.random() * 4); // 每次2-3个
                const batch = students.slice(index, index + batchSize);
                
                // 并行执行这一批的动画
                const promises = batch.map(num => animateSequence(num, finalNums));
                
                // 等待一小会儿再放下一批 (错峰出行)
                await delay(1500); 
                index += batchSize;
            }

            // 全部放完后，稍微等待全部结束（估算值），恢复按钮
            setTimeout(() => {
                isAnimating = false;
                document.getElementById('btn').disabled = false;
            }, 5000); // 这个时间只是兜底，实际动画时长不定
        }

        async function animateSequence(num, finalNums) {
            const p = particles.find(el => el.innerText == num);
            if (!p) return;

            // 1. 初始化
            p.style.opacity = '1';
            p.style.zIndex = '2000';
            p.style.borderRadius = '50%';
            // 保持原色，不改变 background
            
            // 初始坐标 (屏幕中心)
            let curX = window.innerWidth / 2;
            let curY = window.innerHeight + 100;

            // 2. 决定路径
            const targetIdx = finalNums.indexOf(num);
            
            // 随机决定假动作次数：0次 到 3次
            // 有些移动更多次
            const hopsCount =  3 + Math.floor(Math.random() * 7); // 0, 1, 2, 3
            let pathIndices = [];

            // 生成假动作目标
            for(let i=0; i<hopsCount; i++) {
                let decoy;
                let safety = 0;
                do {
                    decoy = Math.floor(Math.random() * 51);
                    safety++;
                } while (
                    (decoy === targetIdx || occupiedIndices.has(decoy) || pathIndices.includes(decoy)) 
                    && safety < 50
                );
                // 只有找到了合法的空位才去，否则跳过
                if (!occupiedIndices.has(decoy) && decoy !== targetIdx) {
                    pathIndices.push(decoy);
                }
            }
            
            // 最后加上终点
            pathIndices.push(targetIdx);

            // 3. 开始执行路径移动
            for (let i = 0; i < pathIndices.length; i++) {
                const isLast = (i === pathIndices.length - 1);
                const destIdx = pathIndices[i];
                const destPos = getPos(destIdx);

                // 执行直角移动 (Move L-shape)
                // 随机决定先X还是先Y
                const xFirst = Math.random() > 0.5;
                const speed = 300; // 单轴耗时 ms

                // 开启 transition 用于位移
                p.style.transition = `transform ${speed}ms linear`; // 使用 linear 更有机械感

                if (xFirst) {
                    // X 轴移动
                    curX = destPos.x;
                    p.style.transform = `translate(${curX}px, ${curY}px) scale(1.1)`;
                    await delay(speed);
                    
                    // Y 轴移动
                    curY = destPos.y;
                    p.style.transform = `translate(${curX}px, ${curY}px) scale(1.1)`;
                    await delay(speed);
                } else {
                    // Y 轴移动
                    curY = destPos.y;
                    p.style.transform = `translate(${curX}px, ${curY}px) scale(1.1)`;
                    await delay(speed);

                    // X 轴移动
                    curX = destPos.x;
                    p.style.transform = `translate(${curX}px, ${curY}px) scale(1.1)`;
                    await delay(speed);
                }

                // 到达站点
                if (!isLast) {
                    // 如果是假动作，停留 0.8秒
                    // 稍微变小一点表示停顿
                    p.style.transition = `transform 0.3s ease-out`;
                    p.style.transform = `translate(${curX}px, ${curY}px) scale(0.9)`;
                    await delay(1.500);
                }
            }

            // 4. 最终落座
            p.style.transition = 'background 0.3s, border-radius 0.3s, color 0.3s, transform 0.3s';
            p.style.transform = `translate(${curX}px, ${curY}px) scale(1)`;
            p.style.background = '#fff';
            p.style.color = '#1a1a2e';
            p.style.borderRadius = '8px';
            p.style.zIndex = '1000';
            
            // 标记此座位已被占用，后续假动作不能来这里
            occupiedIndices.add(targetIdx);
        }
        
        init();
    </script>
</body>
</html>
