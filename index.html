<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级座位系统</title>
    <style>
        :root {
            --seat-size: 60px;
            --unified-gap: 12px;
            --block-margin: 50px;
        }

        * { box-sizing: border-box; }

        html, body { 
            overflow: hidden; 
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0f0f1a;
            color: white;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body { display: flex; flex-direction: column; align-items: center; }

        #particle-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }

        .top-space { height: 40px; }

        .classroom {
            display: flex; flex-direction: row; 
            gap: var(--block-margin); padding: 30px;
            padding-bottom: 120px; 
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px; position: relative;
        }

        /* 教学设施重分布 */
        .teacher-desk {
            position: absolute; bottom: 20px; left: 30px; /* 左下角 */
            width: 120px; height: 50px;
            background: #5d4037; border: 2px solid #3e2723;
            border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: #d7ccc8;
        }
        .whiteboard {
            position: absolute; bottom: 20px; left: 50%; /* 正下方 */
            transform: translateX(-50%);
            width: 450px; height: 12px;
            background: #fdfdfd; border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .area { display: grid; gap: var(--unified-gap); }
        .grid-2x6 { grid-template-columns: repeat(2, var(--seat-size)); }
        .grid-3x5 { 
            grid-template-columns: repeat(3, var(--seat-size)); 
            margin-top: calc(var(--seat-size) + var(--unified-gap)); 
        }

        .seat {
            width: var(--seat-size); height: var(--seat-size);
            border: 2px solid rgba(190, 224, 247, 0.2);
            border-radius: 8px; background: rgba(0, 0, 0, 0.2);
        }

        .fixed-target { border: 2px solid #ffd700 !important; }

        button {
            margin: 20px 0; padding: 12px 40px; font-size: 18px;
            background: linear-gradient(to right, #2ecc71, #27ae60); 
            color: white; border: none; border-radius: 50px; cursor: pointer;
            position: relative; z-index: 2000; transition: all 0.3s ease;
        }
        button:disabled { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        .particle {
            position: absolute; left: 0; top: 0;
            width: var(--seat-size); height: var(--seat-size);
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
            will-change: transform;
            transition: background 0.3s, color 0.3s, border-radius 0.3s;
        }
    </style>
</head>
<body>

    <div class="top-space"></div>
    <button id="btn" onclick="startShuffle()">开始排座</button>

    <div class="classroom" id="classroom">
        <div class="area grid-2x6" id="area1"></div>
        <div class="area grid-3x5" id="area2"></div>
        <div class="area grid-2x6" id="area3"></div>
        <div class="area grid-2x6" id="area4"></div>
        
        <div class="teacher-desk">老师座位</div>
        <div class="whiteboard"></div>
    </div>

    <div id="particle-container"></div>

    <script>
        // 固定座位配置：添加 1号、17号、13号 的固定行列坐标
        const fixedAssignments = {
            17: { r: 6, c: 1 }, 
            13: { r: 6, c: 5 }
        };
        const avoidRestrictions = {15: { avoidR: [1,2,3], avoidC: [] },21: { avoidR: [6], avoidC: [] },32: { avoidR: [], avoidC: [1,2,8,9] }};
        const socialConstraints = [{ ids: [14, 45], minDist: 2 }];

        const config = [
            { id: 'area1', c: 2, r: 6, startCol: 1 }, 
            { id: 'area2', c: 3, r: 5, startCol: 3 },
            { id: 'area3', c: 2, r: 6, startCol: 6 }, 
            { id: 'area4', c: 2, r: 6, startCol: 8 }
        ];

        let seatInfo = [], particles = [], isAnimating = false;

        function getPos(idx) {
            const rect = seatInfo[idx].el.getBoundingClientRect();
            return { x: rect.left, y: rect.top };
        }

        function findSeatIdx(r, c) { return seatInfo.findIndex(s => s.r === r && s.c === c); }

        function init() {
            const container = document.getElementById('particle-container');
            config.forEach(block => {
                const el = document.getElementById(block.id);
                for (let r = 0; r < block.r; r++) {
                    for (let c = 0; c < block.c; c++) {
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        const realR = (block.id === 'area2') ? r + 2 : r + 1;
                        const realC = block.startCol + c;
                        
                        for (let id in fixedAssignments) {
                            if (fixedAssignments[id].r === realR && fixedAssignments[id].c === realC) {
                                seat.classList.add('fixed-target');
                            }
                        }
                        el.appendChild(seat);
                        seatInfo.push({ el: seat, r: realR, c: realC });
                    }
                }
            });

            // 预先渲染粒子：固定座位打开页面直接显示号码
            const fixedIds = Object.keys(fixedAssignments).map(Number);
            seatInfo.forEach((seat, idx) => {
                const p = document.createElement('div');
                p.className = 'particle';
                
                // 查找该位置是否有固定绑定的学号
                let matchFixedId = null;
                for (let id in fixedAssignments) {
                    if (fixedAssignments[id].r === seat.r && fixedAssignments[id].c === seat.c) {
                        matchFixedId = id;
                        break;
                    }
                }

                if (matchFixedId !== null) {
                    p.innerText = matchFixedId;
                    p.style.background = '#fff';
                    p.style.color = '#1a1a2e';
                    p.style.borderRadius = '8px';
                    p.style.border = 'none';
                    p.style.boxShadow = 'none';
                } else {
                    p.innerText = '';
                }

                p.style.opacity = '1';
                container.appendChild(p);
                particles.push(p);

                // 绑定位置
                const pos = getPos(idx);
                p.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
            });
        }

        // 标准的 Fisher-Yates 无偏洗牌算法
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getValidShuffle() {
            let nums = new Array(seatInfo.length).fill(0);
            let used = new Set();

            // 1. 安置固定座位
            for (let id in fixedAssignments) {
                const s = fixedAssignments[id], idx = findSeatIdx(s.r, s.c);
                if (idx !== -1) { nums[idx] = parseInt(id); used.add(parseInt(id)); }
            }

            // 2. 准备学生列表，使用 Fisher-Yates 进行绝对公正洗牌
            let others = [];
            for (let i = 1; i <= 51; i++) if (!used.has(i)) others.push(i);
            shuffleArray(others);

            // 3. 分配座位并检查约束
            for (let id of others) {
                let possibleIndices = [];
                for (let i = 0; i < seatInfo.length; i++) {
                    if (nums[i] !== 0) continue; 

                    // 检查 A: 避让限制
                    if (avoidRestrictions[id]) {
                        const res = avoidRestrictions[id];
                        if (res.avoidR.includes(seatInfo[i].r) || res.avoidC.includes(seatInfo[i].c)) continue;
                    }

                    // 检查 B: 社交约束
                    let isSocialConflict = false;
                    for (let con of socialConstraints) {
                        if (con.ids.includes(id)) {
                            const partnerId = con.ids.find(x => x !== id);
                            const partnerIdx = nums.indexOf(partnerId);
                            if (partnerIdx !== -1) {
                                const rDist = Math.abs(seatInfo[i].r - seatInfo[partnerIdx].r);
                                const cDist = Math.abs(seatInfo[i].c - seatInfo[partnerIdx].c);
                                if (rDist === 0 && cDist <= con.minDist) isSocialConflict = true;
                            }
                        }
                    }
                    if (isSocialConflict) continue;

                    possibleIndices.push(i);
                }

                if (possibleIndices.length > 0) {
                    // 随机挑选一个符合条件的空位
                    const randomIdx = possibleIndices[Math.floor(Math.random() * possibleIndices.length)];
                    nums[randomIdx] = id;
                } else {
                    // 兜底方案：随机选择任意空位（而不是固定找第一个空位）
                    let emptyIndices = [];
                    nums.forEach((val, idx) => { if (val === 0) emptyIndices.push(idx); });
                    const fallbackIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                    nums[fallbackIdx] = id;
                }
            }
            return nums;
        }

        // 独立粒子的滚动逻辑：只在未确定的学号池中随机抽取
        // 改进后的滚动与就座逻辑
function rollSeat(p, finalNum, totalDuration, getPool, onLock) {
    return new Promise((resolve) => {
        let elapsed = 0;

        function step() {
            let progress = elapsed / totalDuration;

            // 1. 达到总时长，正式锁定就座样式
            if (elapsed >= totalDuration) {
                p.innerText = finalNum;
                    p.style.background = '#fdfdfd';
                    p.style.color = '#0f0f1a';
                    p.style.borderRadius = '6px';
                    onLock(finalNum); // 告知主流程：该号码已落锁
                    resolve();
                    return;
            }

            // 2. 动态计算切换间隔（前 70% 保持 40ms 高速，后 30% 平滑减速至 280ms）
            let interval = 120;
            if (progress > 0.4) {
                let slowEase = (progress - 0.5 * Math.random()); // 0 ~ 1
                interval = 500 + (slowEase * slowEase * 2000);
            }

            // 3. 切换数字逻辑：减速后期（> 85%）提前停在目标数字上，避免瞬间跳转
            const pool = getPool();
            if (progress > 0.85) {
                p.innerText = finalNum; // 提前显示目标学号，产生“刹车停靠”视觉
            } else if (pool.length > 0) {
                p.innerText = pool[Math.floor(Math.random() * pool.length)]; // 滚动未确定的学号
            } else {
                p.innerText = finalNum;
            }

            elapsed += interval;
            setTimeout(step, interval);
        }

        step();
    });
}

        async function startShuffle() {
            if (isAnimating) return;
            isAnimating = true;
            document.getElementById('btn').disabled = true;

            const finalLayout = getValidShuffle();
            const fixedIds = Object.keys(fixedAssignments).map(Number);

            // 1. 建立未确认学号的初始候选池
            let unconfirmedPool = finalLayout.filter(id => !fixedIds.includes(id));

            // 2. 重置非固定位的状态为待抽号问号
            seatInfo.forEach((seat, idx) => {
                const p = particles[idx];
                const assignedId = finalLayout[idx];
                const pos = getPos(idx);
                p.style.transform = `translate(${pos.x}px, ${pos.y}px)`;

                if (!fixedIds.includes(assignedId)) {
                    p.innerText = '';
                    p.style.background = 'linear-gradient(135deg, #3498db, #8e44ad)';
                    p.style.color = '#fff';
                    p.style.border = 'none';
                    p.style.borderRadius = '50%';
                    p.style.boxShadow = '0 0 15px rgba(52, 152, 219, 0.5)';
                }
            });

            await new Promise(r => setTimeout(r, 400));

            // 3. 计算从 (5, 3) 扩散的顺序
            const seatOrder = seatInfo
                .map((_, index) => ({ index }))
                .sort(() => Math.random() - 0.5);

            // 4. 并发波浪式启动：从中心依次向外启动滚动
            const rollPromises = [];

            for (let i = 0; i < seatOrder.length; i++) {
                const seatIdx = seatOrder[i].index;
                const targetId = finalLayout[seatIdx];

                // 跳过固定位
                if (fixedIds.includes(targetId)) continue;

                // 随机持续 3200ms ~ 4000ms 的缓慢变慢过程
                const duration = 4000 + Math.random() * 3000; 

                // 启动当前格子的滚动（不 await，直接并发）
                const pPromise = rollSeat(
                    particles[seatIdx],
                    targetId,
                    duration,
                    () => unconfirmedPool,
                    (lockedNum) => {
                        // 某个座位确定后，从候选池剔除该学号
                        const pIdx = unconfirmedPool.indexOf(lockedNum);
                        if (pIdx > -1) unconfirmedPool.splice(pIdx, 1);
                    }
                );

                rollPromises.push(pPromise);

                // 间隔 100 毫秒启动下一个格子，产生从中心向外扩散的波浪视觉
                await new Promise(r => setTimeout(r, 1000));
            }

            // 等待所有座位全部滚动完毕并落锁
            await Promise.all(rollPromises);

            setTimeout(() => {
                isAnimating = false;
                document.getElementById('btn').disabled = false;
            }, 500);
        }

        window.onload = init;
    </script>
</body>
</html>
